kind = "web"
previewPath = "/"
title = "ITW ARC"
description = "A premium editorial landing page for ITW ARC, the advisory, regulatory and compliance practice serving sports, media and entertainment businesses."
version = "1.0.0"
id = "artifacts/itw-arc"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20568

[services.development]
run = "pnpm --filter @workspace/itw-arc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/itw-arc", "run", "build" ]
serve = "static"
publicDir = "artifacts/itw-arc/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20568"
BASE_PATH = "/"
